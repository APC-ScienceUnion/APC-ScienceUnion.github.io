    Hello, everyone! A new school term is almost here. Are you ready? A-kun wishes you steady progress and excellent results throughout the semester!

    To help you begin the term, A-kun has prepared some stationery gifts that we hope readers will find useful (๑˙v˙๑)! Starting now, A-kun will draw 2 people from the likes on this Qzone post and another 2 from its reposts, sending each a small back-to-school gift.

    Finally, thank you for following A-kun all this time. We will keep communicating science and hope that more people discover and enjoy our work. We will stay true to our purpose and never turn into a clickbait content mill (ง •̀_•́)ง! We hope to make our science communication even better. Thank you!
