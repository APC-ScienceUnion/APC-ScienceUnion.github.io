- title: "Happy 7th Birthday to Gewu Society/APC Science Union!"
  start: 2023-07-05
  end: 2023-07-05
  cover: /images/apc-news/asset-25b01761a8.jpg
  content: |
    Another year has gone by for the Union, with all of you beside us. Over that year, our wonderful science communication team produced articles on astronomy, architecture, electronic communications, and many other subjects. You can read them on our website, Bilibili column, Zhihu column, and WeChat account.

    We are especially grateful to Sirius King for carefully planning and preparing two scientist cosplay shoots this year, featuring Charles Messier and Hou Debang. By telling their stories from an unexpected angle, the shoots made both scientists feel vividly present. The journey is not over yet. Who do you think will star in the next feature shoot? (Hint: the figure comes from ancient China.)

