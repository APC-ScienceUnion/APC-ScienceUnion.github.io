- title: "Scientist Cosplay No. 5: Charles Messier"
  start: 2023-01-02
  end: 2023-01-02
  cover: /images/apc-news/asset-060c6ba074.jpg
  content: |
    On camera: Sirius King
    Makeup: Huhu
    Photography: Misty Rain
    Logistics: Weilong, Yaoxiao
    Location: Dingxiang Lake Park
    Post-production: Xiaohai
    Compositing: Teacher Yin
    Photo selection: Baishui, Lu Qing, Su Chen, Lele, Black Rock Macchiato, Supernova, the official Gewu Society account, and everyone in the main APC group who helped choose images
    Consultants:
    Astronomy: Supernova
    History: Lu Zhe
    Hydrology and history: Lao Ma
    European clothing and history: von Schnelltenberg
    Final-image format: Song Ci
    Official partner: Gewu Society
    Special thanks to Digua for advice on the post-production files.
    Special thanks to Qiqi for recommending Teacher Yin for compositing.
    We gratefully acknowledge the online archive of the Royal Observatory Greenwich.
    We also acknowledge NASA's Astronomy Picture of the Day; the image used here is from 2022.8.23 and served as material for the final composite.
    Special thanks to astrophotographer Julien Looten. Your image of meteors and the Milky Way over the Mediterranean made this composite possible. I imagine Charles Messier once looked up at a sky much like this one. Image source and copyright: Julien Looten (the original is image 12).
    “Why did you choose to become a naval astronomer?”
    “There were many reasons, really. But the stars are there, aren't they?”
    This conversation may never have taken place, and Messier's answer was probably different. Even so, I believe it expresses something Messier and many astronomy enthusiasts have felt.
    Although this is my own interpretation, the characterization and props draw on references. (The visual reference appears in the second-to-last image; I have omitted the translated image.) I still owe an apology, though: the pants and telescope have become hardworking regulars, appearing year after year from Darwin to Messier. /covers face I genuinely could not afford a proper compass at the time, so I used a U.S. military compass. An old friend, in fact; it also appeared in the Linnaeus shoot. Compositing is expensive, so I am sorry that I could afford only one composite.
    A few personal messages:
    To Uncle Yu: Thank you for driving me to Dingxiang Lake!
    To Huhu: Thank you for taking on makeup for such an obscure cosplay. Every request I bring you must feel like another absurd challenge at your door, and I appreciate you helping make this dream come true.
    To Yaoxiao: You saved someone who has no idea how to pose, sob. Of course you did!
    To Supernova: Thank you, my junior schoolmate, for running around, helping with everything, and still meeting the writing deadline. There were only one or two stars in the original, and you still identified one. Incredible!
    To Lu Zhe: Brother! My own dear brother! You found reference images for something this obscure. Amazing. Meeting you on that trip to Daqinggou was like discovering a treasure trove of history.
    To Lao Ma: Dingxiang Lake really does not look like the sea at night. /crying with laughter But compared with the light pollution at Wulihe Beach, it was fairly forgiving. Thank you for all the work and care you put into the historical research.
    To Mr. Schnelltenberg: You are a true gentleman, and your help with the clothing was invaluable. I will need more of your guidance on European history in the future. Thank you in advance.
    To Song Ci: Thank you for your generous advice. I would truly have been lost without you. Welcome aboard as we set out across the stars in 2023.
    ![Event poster](/images/apc-news/asset-6e8a5110fe.jpg)

