    Happy 7th birthday in advance to the Union @Gewu Society | General Science official
    From steamed buns and bread to industry's “three acids and two alkalis,” the Hou process is everywhere. That unassuming white powder laid a foundation for an entire nation's chemical industry. Our history textbook contains only the second image, and few other photographs can be found online. Because Mr. Hou studied overseas in his youth, I chose black-and-white images in an effort to reconstruct his younger appearance. Perhaps this was how spirited he looked when he received a gold medal at the world's fair.
