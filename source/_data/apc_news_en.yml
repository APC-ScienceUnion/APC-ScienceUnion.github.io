- title: "2017 New Year Message"
  start: 2016-12-31
  end: 2016-12-31
  cover: /images/apc-news/asset-beac4e94ef.jpg
  content: |
    In the new year, we will continue forward along a bright road.

    The year 2016 was full of wonders. On 7/5, APC Science Union was born. As a new organization, we explored and developed through the haze of our scientific convictions, eventually opening a path of our own!

    Looking back over these six months, we already have much to show: 3 directly affiliated space stations, 9 chapters of *The Walker's Universe*, 4 astronomy, physics, and chemistry exam papers, an APC Science Union community, and an official Union science communication account. We established positive diplomatic relations with other scientific organizations and worked with Xingyue to resolve a recent series of notorious mass-removal incidents in the astronomy community. We continued to improve, growing from the original Science and Publicity departments to include the Activity Organization Department, Military Affairs Department, Internal Administration, Finance Department, and an intern policy. More people gradually came to know us.

    Now a new year has arrived, and the Union has already prepared a series of plans. We will release a chemistry-themed popular science book and continue improving the APC Science Union system. We believe that in 2017 we will not become complacent about past achievements or stop moving forward. We will work even harder for our dreams and for what we love!

    Happy New Year to everyone in 2017!

    From: Former Union leader Shiguang

