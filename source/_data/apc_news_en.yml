  end: 2023-05-31
  cover: /images/apc-news/asset-ba8f9fa90c.jpg
  content: |
    The Hou Debang installment of our Scientist Cosplay series represents the C in APC: chemistry. It is presented by Union member Sirius King. Thank you, Sirius King, for everything you have contributed to the series. All three letters in APC now have their own scientist cosplay!
    Let chemical engineering spread its wings once more!
    The Chinese people can and will make their own soda ash!
    Photography: Uncle Yu
    Post-production: Song Ziming
    Thanks to our European clothing consultant for suggestions and references for poses in the black-and-white photographs.
