- title: "APC Science Union Is Officially Established!"
  start: 2016-07-05
  end: 2016-07-05
  cover: /images/apc-news/asset-beac4e94ef.jpg
  content: |
    Founders: Shiguang (Union leader), Jasically Jiang (Union deputy leader)
    Meaning of the organization's name: A means Astronomy, P means Physics, and C means Chemistry. Together, APC represents an organization for science communication and discussion in astronomy, physics, and chemistry.
    Purpose of the Union: To explore this uncertain world with students everywhere and travel through the realm of science. The organization focuses primarily on astronomy outreach while also covering physics, chemistry, biology, literature, and history.
    Diplomatic principles: APC Science Union follows peaceful, independent, and autonomous policies in its external relations and actively seeks mutual progress with other organizations. The Union nevertheless firmly defends its fundamental principles. It will impose sanctions on organizations and individuals that seriously infringe its interests without legitimate reason, and will severely punish those who deliberately disrupt order or damage a friendly environment.
    The Union logo appears below. Follow us!
    ![Event poster](/images/apc-news/asset-beac4e94ef.jpg)
