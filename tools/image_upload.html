<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片上传 · 格物社</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#172b36;background:#f0f4f3}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:44px auto;padding:0 24px}header{margin-bottom:28px}.eyebrow{color:#31736b;font-size:13px;font-weight:700;letter-spacing:2px}h1{font-size:32px;margin:12px 0}p{line-height:1.8;color:#597079}.card{background:white;border:1px solid #dbe5e2;border-radius:18px;padding:28px;margin:18px 0;box-shadow:0 6px 22px #203b3810}.row{display:grid;grid-template-columns:1fr 2fr;gap:18px}label{display:block;font-weight:600;font-size:14px}input[type=text]{display:block;width:100%;margin-top:10px;padding:13px;border:1px solid #becfc9;border-radius:8px;font:inherit}small{display:block;color:#6b7d83;margin-top:9px;line-height:1.7}.drop{padding:32px;border:2px dashed #a8c7be;border-radius:12px;text-align:center;margin:24px 0;background:#f7fbf9}.drop.over{background:#e2f1eb}input[type=file]{max-width:100%;margin:14px 0}.files{font-size:13px;color:#5b6f76;line-height:1.8}button{border:0;border-radius:9px;padding:13px 20px;background:#176859;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:#e6efeb;color:#23564b;margin:8px 8px 8px 0}#status{margin-left:12px;font-size:14px}#result[hidden]{display:none}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f7f5;padding:18px;border-radius:9px;line-height:1.8;font-size:13px}#error{color:#ad3434;white-space:pre-wrap}footer{font-size:13px;color:#70817f;margin:24px 4px}@media(max-width:600px){.row{grid-template-columns:1fr}main{margin:24px auto}.card{padding:20px}h1{font-size:27px}}
</style><main><header><div class="eyebrow">格物社 / 本地工具</div><h1>图片上传</h1><p>保存本地副本，上传至上海服务器。文章保持本站路径，发布时自动优先读取服务器图片。</p></header>
<section class="card"><div class="row"><label>文章分类<input id="category" type="text" list="categories" placeholder="例如：物理学"><datalist id="categories"></datalist></label><label>文章图片目录<input id="bucket" type="text" placeholder="例如：为什么天空是蓝色的"><small>使用独立目录，避免与其他文章重名。</small></label></div>
<div class="drop" id="drop"><strong>把图片拖到这里，或选择图片</strong><div><input id="files" type="file" accept="image/*" multiple aria-label="选择图片"></div><div class="files" id="selected">每批最多 100 张、合计 50 MB。已有图片不会被清理。</div></div>
<button id="upload">保存并上传</button><span id="status" aria-live="polite"></span><p id="error" role="alert"></p><small>同名且内容不同的本地图片不会被覆盖。上传成功后，还需要将文章与 source/images 中的图片一起提交发布，网站备用图片才会生效。</small></section>
<section class="card" id="result" hidden><h2>上传完成</h2><p>把下面的 Markdown 复制进文章即可。已自动保留中文目录并生成可用的网址。</p><button class="secondary" id="copy">复制 Markdown</button><button class="secondary" id="copyUrls">复制服务器网址</button><pre id="markdown"></pre><details><summary>查看服务器目录与备用网址</summary><pre id="details"></pre></details></section><footer>仅在本机运行 · 使用受限上传账号 · 不发布文章、不开放评论</footer></main>
<script>
const token='__UPLOAD_TOKEN__';let selected=[],result;
const el=id=>document.getElementById(id);
fetch('/categories').then(r=>r.json()).then(d=>d.categories.forEach(name=>{const option=document.createElement('option');option.value=name;el('categories').append(option);}));
function choose(files){selected=Array.from(files);el('selected').textContent=selected.map(f=>f.name).join(' · ')+'（'+(selected.reduce((n,f)=>n+f.size,0)/1024/1024).toFixed(1)+' MB）';}
el('files').onchange=e=>choose(e.target.files);
el('drop').ondragover=e=>{e.preventDefault();el('drop').classList.add('over');};el('drop').ondragleave=()=>el('drop').classList.remove('over');el('drop').ondrop=e=>{e.preventDefault();el('drop').classList.remove('over');choose(e.dataTransfer.files);};
function encode(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>resolve({name:file.name,data:String(reader.result).split(',')[1]});reader.readAsDataURL(file);});}
el('upload').onclick=async()=>{
 el('error').textContent='';el('result').hidden=true;el('status').textContent='';
 if(!selected.length||selected.length>100||selected.reduce((n,f)=>n+f.size,0)>50*1024*1024){el('error').textContent='请选择 1–100 张图片，合计不超过 50 MB。';return;}
 if(!el('category').value.trim()||!el('bucket').value.trim()){el('error').textContent='请填写文章分类和图片目录。';return;}
 el('upload').disabled=true;el('status').textContent='正在保存、上传并核对图片，请保持窗口打开…';
 try{const response=await fetch('/upload',{method:'POST',headers:{'Content-Type':'application/json','X-Upload-Token':token},body:JSON.stringify({category:el('category').value.trim(),bucket:el('bucket').value.trim(),files:await Promise.all(selected.map(encode))})});result=await response.json();if(!response.ok)throw Error(result.error||'上传失败');el('markdown').textContent=result.images.map(x=>x.markdown).join('\n\n');el('details').textContent=result.images.map(x=>'本地文件：'+x.source+'\n服务器目录：'+x.serverDirectory+'\n服务器网址：'+x.url+'\n备用网址：'+x.fallback).join('\n\n');el('result').hidden=false;el('status').textContent='已完成 '+result.images.length+' 张图片';}catch(error){el('error').textContent=error.message;el('status').textContent='未完成，可检查后重试。';}finally{el('upload').disabled=false;}
};
el('copy').onclick=()=>navigator.clipboard.writeText(el('markdown').textContent).then(()=>el('status').textContent='Markdown 已复制');el('copyUrls').onclick=()=>navigator.clipboard.writeText(result.images.map(x=>x.url).join('\n')).then(()=>el('status').textContent='服务器网址已复制');
</script></html>
