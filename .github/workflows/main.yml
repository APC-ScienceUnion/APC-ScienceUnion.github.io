name: Build Pages

on:
  push:
    branches: [ source ]

  workflow_dispatch:

concurrency:
  group: pages-source-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        env:
          # The Pages build only validates an existing poster; the scheduled
          # science-history workflow is the one that needs a browser to render.
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          sudo apt-get update
          sudo apt-get install nasm -y
          python -m pip install --requirement tools/science_history/requirements.txt
          python -m pip install --requirement tools/daily_images_requirements.txt
          npm install -g hexo-cli
          npm install
          npm install hexo-all-minifier --save
          
      - name: Build
        env:
          COMMUNITY_API_URL: ${{ vars.COMMUNITY_API_URL }}
          IMAGE_HOST_URL: ${{ vars.IMAGE_HOST_URL }}
          APC_SERVER_ENABLED: ${{ vars.APC_SERVER_ENABLED }}
        run: |
          if [ -n "$COMMUNITY_API_URL$IMAGE_HOST_URL" ] && [ "$APC_SERVER_ENABLED" != "true" ]; then
            echo 'Server URLs require APC_SERVER_ENABLED=true so images and article permissions are synced before publication.'
            exit 1
          fi
          npm test --prefix services/community
          node --test tests/test_server_assets.js tests/test_upload_images.js tests/test_visitor_count.js
          python tools/localize_gallery_images.py --check
          npm run content-layout:check
          npm run bilingual:check
          npm run honor-hall:check
          npm run assets:check
          npm run daily-images:check
          npm run daily-widgets:check
          npm run science-history:check
          hexo clean
          git clone https://oauth2:${{ secrets.GITHUB_TOKEN }}@github.com/APC-ScienceUnion/APC-ScienceUnion.github.io.git public -b main --depth=1 
          node tools/server_assets.js snapshot public "$RUNNER_TEMP/apc_previous_images"
          cd public
          git rm -rf .
          cd ..
          hexo g
          # Publish category-organized source assets at their established flat
          # /images/<asset-bucket>/ URLs without transforming their bytes.
          npm run images:publish-categorized
          npm run images:check-categorized
          cp .gitattributes ./public/.gitattributes
          npm run assets:check-public
          npm run daily-images:check-public
          npm run science-history:check-public
          npm run homepage:check-public
          node tests/test_community_pages.js
          cp -r ./404 ./public
          # Keep previously published image paths available for cached articles.
          # Restore only absent images after checking the current source assets.
          node tools/server_assets.js restore "$RUNNER_TEMP/apc_previous_images" public

      - name: Sync images and community article manifest
        if: vars.APC_SERVER_ENABLED == 'true'
        env:
          APC_SERVER_HOST: ${{ vars.APC_SERVER_HOST }}
          APC_DEPLOY_USER: ${{ vars.APC_DEPLOY_USER }}
          COMMUNITY_API_URL: ${{ vars.COMMUNITY_API_URL }}
          IMAGE_HOST_URL: ${{ vars.IMAGE_HOST_URL }}
          APC_DEPLOY_KEY: ${{ secrets.APC_PUBLISH_KEY }}
          APC_KNOWN_HOSTS: ${{ secrets.APC_KNOWN_HOSTS }}
        run: |
          umask 077
          export APC_SSH_KEY_FILE="$RUNNER_TEMP/apc_deploy_key"
          export APC_KNOWN_HOSTS_FILE="$RUNNER_TEMP/apc_known_hosts"
          printf '%s\n' "$APC_DEPLOY_KEY" > "$APC_SSH_KEY_FILE"
          printf '%s\n' "$APC_KNOWN_HOSTS" > "$APC_KNOWN_HOSTS_FILE"
          bash services/community/deploy/publish.sh

      - name: Deploy
        run: |
          cd public
          git config --global user.email "bot@apc-science.cn"
          git config --global user.name "Auto Deploy Bot"
          git add .
          git commit -m "Automatic Deploy"
          git push -f
        
