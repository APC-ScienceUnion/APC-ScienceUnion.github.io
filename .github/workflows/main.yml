name: Build Pages

on:
  push:
    branches: [ source ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        env:
          # The Pages build only validates an existing poster; the scheduled
          # science-history workflow is the one that needs a browser to render.
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          sudo apt-get update
          sudo apt-get install nasm -y
          python -m pip install --requirement tools/science_history/requirements.txt
          npm install -g hexo-cli
          npm install
          npm install hexo-all-minifier --save
          
      - name: Build
        run: |
          npm run bilingual:check
          npm run assets:check
          npm run daily-images:check
          npm run daily-widgets:check
          npm run science-history:check
          hexo clean
          git clone https://oauth2:${{ secrets.GITHUB_TOKEN }}@github.com/APC-ScienceUnion/APC-ScienceUnion.github.io.git public -b main --depth=1 
          cd public
          git rm -rf .
          cd ..
          hexo g
          # Copy committed static images verbatim before integrity checks. This
          # also covers asset directories whose names contain glob metacharacters.
          mkdir -p public/images
          cp -a source/images/. public/images/
          cp .gitattributes ./public/.gitattributes
          npm run bilingual:check-public
          npm run assets:check-public
          npm run daily-images:check-public
          npm run science-history:check-public
          npm run homepage:check-public
          cp -r ./404 ./public
          
      - name: Deploy
        run: |
          cd public
          git config --global user.email "bot@apc-science.cn"
          git config --global user.name "Auto Deploy Bot"
          git add .
          git commit -m "Automatic Deploy"
          git push -f
        
