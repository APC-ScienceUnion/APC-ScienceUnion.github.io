name: Refresh Science History Snapshot

on:
  workflow_dispatch:
    inputs:
      payload_b64:
        description: "AstrBot candidate JSON encoded as base64; leave empty for the manual Qwen fallback"
        required: false
        default: ""
        type: string
      delivery_id:
        description: "YYYY-MM-DD:sha256(canonical candidate JSON)"
        required: false
        default: ""
        type: string
      allow_revision:
        description: "Explicitly allow a different same-day draft (manual correction only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: source-snapshot-writers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: source
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decode and authenticate AstrBot candidate
        id: ingest
        if: inputs.payload_b64 != ''
        env:
          SCIENCE_HISTORY_PAYLOAD_B64: ${{ inputs.payload_b64 }}
          SCIENCE_HISTORY_DELIVERY_ID: ${{ inputs.delivery_id }}
          SCIENCE_HISTORY_ALLOW_REVISION: ${{ inputs.allow_revision }}
        run: >-
          python tools/dispatch_science_history.py
          --decode-env
          --output "${{ runner.temp }}/astrbot-science-history.json"
          --current-json source/ScienceHistory/science_today.json

      - name: Install renderer and source-check dependencies
        if: inputs.payload_b64 == '' || steps.ingest.outputs.changed == 'true'
        run: |
          npm ci
          python -m pip install --requirement tools/science_history/requirements.txt
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk

      - name: Research, verify, and render today's snapshot
        id: generate
        if: inputs.payload_b64 == '' || steps.ingest.outputs.changed == 'true'
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          SCIENCE_HISTORY_DELIVERY_ID: ${{ inputs.delivery_id }}
        shell: bash
        run: |
          if [[ -n "${SCIENCE_HISTORY_DELIVERY_ID}" ]]; then
            export SCIENCE_HISTORY_PRODUCER="astrbot:science-history-today"
            python tools/history_today_poster.py \
              --date "${{ steps.ingest.outputs.date }}" \
              --input "${{ runner.temp }}/astrbot-science-history.json" \
              --review-mode automated-retrieval-gates
          else
            python tools/history_today_poster.py
          fi

      # A failed research/API/render run must never replace the last good pair.
      # The generator stages all three files before its transactional publish;
      # this fallback verifies the retained snapshot and makes the reason clear.
      - name: Keep and verify the last successful snapshot after a failed refresh
        if: failure() && steps.generate.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Today's science-history refresh failed; retaining the last successful local snapshot."
          python tools/history_today_poster.py --check

      - name: Verify the local snapshot and private source audit
        if: steps.generate.outcome == 'success'
        run: npm run science-history:check

      - name: Commit source snapshot
        id: commit
        if: steps.generate.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- source/ScienceHistory/science_today.json \
            source/ScienceHistory/science_today.png \
            tools/science_history/sources/science_today.sources.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Science-history snapshot is already current."
            exit 0
          fi
          git commit -m "chore: refresh science history snapshot"
          git pull --rebase origin source
          git push origin HEAD:source
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Commits made with GITHUB_TOKEN do not start ordinary push workflows.
      - name: Trigger Pages deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run main.yml --ref source


